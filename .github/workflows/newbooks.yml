name: newbooks

on:
  workflow_dispatch: # enables you to run it manually

  schedule:
    - cron: "00 11 * * *" # runs at 06:00 UTC (6:00 AM CST) everyday

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo content
        uses: actions/checkout@v5

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: execute py script
        env:
          ALMA_API_KEY: ${{ secrets.ALMA_API_KEY }}
          GB_API_KEY: ${{ secrets.GB_API_KEY }}
        run: |
            python -m pip install --upgrade pip
            python -m pip install xmltodict requests
            cd docs
            python - <<'PY'
            import json
            import os

            with open("config.py", "w", encoding="utf-8") as f:
                f.write(f"ALMA_API_KEY = {json.dumps(os.environ.get('ALMA_API_KEY', ''))}\n")
                f.write(f"GB_API_KEY = {json.dumps(os.environ.get('GB_API_KEY', ''))}\n")
            PY
            python new-books.py

      - name: deploy to github pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/gh-pages
          force_orphan: true
